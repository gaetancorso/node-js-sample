version: 2.1

executors:
  vm-executor:
    machine: true
    working_directory: ~/app
     

jobs:
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Say hello"
          command: "echo Hello, World!"

  build-docker-image:
    executor: vm-executor
    steps:
      - checkout
      - run:
          name: "Install curl"
          command: "apk add --no-cache curl"
      - run:
          name: "Check Dockerfile existence"
          command: |
            if [ ! -f dockerfile ]; then
              echo "Dockerfile missing" && exit 1
            fi
            echo "Dockerfile found"
      - run:
          name: "Build Docker Image"
          command: "docker build -t myapp:latest ."
      - run:
          name: "Run and Test Container"
          command: |
            docker run --rm -d -p 8080:8080 --name test-container myapp:latest
            sleep 10
            curl http://localhost:8080 || (echo "Application not started" && exit 1)

workflows:
  say-hello-workflow:
    jobs:
      - say-hello
      - build-docker-image
